<p>ex11-carrinho-de-compras works!</p>

<h2>{{ produto }}</h2>

<p>Preço: {{ preco | currency: 'BRL' }}</p>

<p>
  Quantidade:

  <button [disabled]="quantidade === 1" (click)="diminuirQuantidade()">-</button>

  {{ quantidade }}

  <button (click)="aumentarQuantidade()">+</button>
</p>

<p>Total: {{ total | currency: 'BRL' }}</p>

<button (click)="adicionarCarrinho()">Adicionar ao carrinho</button>

@if (mensagem) {
  <p>{{ mensagem }}</p>
}
