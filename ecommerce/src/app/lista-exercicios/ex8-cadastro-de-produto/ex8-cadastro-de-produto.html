<p>ex8-cadastro-de-produto works!</p>
<input [(ngModel)]="produto" placeholder="Produto: " />
<input [(ngModel)]="preco" placeholder="Preco: " />
<input [(ngModel)]="quantidade" placeholder="Quantidade: " />

<p>Produto: {{ produto }}</p>
<p>Preço: {{ preco | currency: 'BRL' }}</p>
<p>Quantidade: {{ quantidade }}</p>
<p>Total: {{ preco * quantidade }}</p>
